server:
  port: ${PORT}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
    min-response-size: 1024

spring:
  application:
    name: P2P-SERVICE
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

user:
  catalog:
    service:
      name: ${USER_CATALOG_SERVICE_NAME}
      url: ${USER_CATALOG_URL}

ghost:
  shield:
    key: ${GHOST_SHIELD_KEY}
    jwt-secret: ${GHOST_SHIELD_JWT_SECRET}
  gateway:
    secret: ${GHOST_GATEWAY_SECRET}


logging:
  level:
    root: INFO
    org.springframework.web.socket: DEBUG
    com.SHADOW.P2P_SERVICE: INFO
    org.springframework.messaging: TRACE
    org.springframework.web.socket.messaging: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"