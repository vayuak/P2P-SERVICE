server:
  port: ${PORT:8096}

spring:
  application:
    name: P2P-SERVICE

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    root: INFO
    org.springframework.web.socket: DEBUG # Live-tracks connection/disconnection handshakes.
    com.SHADOW.P2P_SERVICE: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"
