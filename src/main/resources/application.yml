server:
  port: ${PORT:8096}

spring:
  application:
    name: P2P-SERVICE

  # ========================================================
  # 🐘 LIVE PERSISTENT STORAGE: POSTGRESQL LAYER (NEW FOR P2P)
  # ========================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# ========================================================
# 🛡️ SECURITY TOKENS (STRICT FAIL-FAST MAPPING)
# ========================================================
ghost:
  shield:
    key: ${GHOST_SHIELD_KEY}
    jwt-secret: ${GHOST_SHIELD_JWT_SECRET}
  gateway:
    secret: ${GHOST_GATEWAY_SECRET}

# ========================================================
# 🗺️ SERVICE REGISTRY (DISABLED)
# ========================================================
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ========================================================
# 📝 LOGGING CONFIGURATION
# ========================================================
logging:
  level:
    root: INFO
    org.springframework.web.socket: DEBUG # Live-tracks connection/disconnection handshakes.
    com.SHADOW.P2P_SERVICE: INFO # Change to DEBUG temporarily if you want to see SQL queries!
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"