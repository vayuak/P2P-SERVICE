server:
  port: 8096

spring:
  application:
    name: P2P-SERVICE


# ========================================================
# 🗺️ SERVICE REGISTRY MAPPING ENGINE (EUREKA)
# ========================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# ========================================================
# 📊 STREAM MONITOR LOG STYLING
# ========================================================
logging:
  level:
    root: INFO
    org.springframework.web.socket: DEBUG # Live-tracks connection/disconnection handshakes
    com.SHADOW.P2P_SERVICE: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"